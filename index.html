<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">Portada</div>
            <nav>
                <ul>
                    <li>Inicio</li>
                    <li>Servicios</li>
                    <li>Contacto</li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>Daniel Peñaranda</h1>
    </section>

    <section class="content">
        <button>Soporte tecnico</button>
        <div class="features">
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 1</p>
            </div>
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 2</p>
            </div>
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 3</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footerlogo">Soporte Remoto</div>
            <p>Principales ciudades</p>
            <div class="social-icons">
                <div class="icon">B</div>
                <div class="icon">S</div>
                <div class="icon">C</div>
                <div class="icon">V</div>
            </div>
        </div>
    </footer>
</body>
</html>
