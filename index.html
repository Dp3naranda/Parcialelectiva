<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Web</title>
    <style>
        /* Estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Encabezado */
        header {
            background-color: blue;
            color: white;
            padding: 10px 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar nav ul li {
            cursor: pointer;
        }

        .hero {
            background-color: #ddd;
            width: 100%;
            text-align: center;
            padding: 30px 0;
        }

        .hero h1 {
            font-size: 3rem;
        }

        /* Sección de contenido */
        .content {
            text-align: center;
            margin: 20px 0;
            padding: 50px 20px;
        }

        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            margin: 20px 0;
            font-size: 1rem;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .feature {
            background-color: white;
            padding: 20px;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .circle {
            width: 50px;
            height: 50px;
            background-color: #007BFF;
            border-radius: 50%;
            margin: auto;
        }

        footer {
            width: 100%;
            background-color: #f0f0f0;
            padding: 20px 0;
            text-align: center;
            margin-top: 20px;
        }

        .footer-content {
            max-width: 900px;
            margin: auto;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .icon {
            width: 20px;
            height: 20px;
            background-color: #bbb;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">Portada</div>
            <nav>
                <ul>
                    <li>Inicio</li>
                    <li>Servicios</li>
                    <li>Contacto</li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>Daniel Peñaranda</h1>
    </section>

    <section class="content">
        <button>Soporte técnico</button>
        <div class="features">
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 1</p>
            </div>
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 2</p>
            </div>
            <div class="feature">
                <div class="circle"></div>
                <p>Asistencia 3</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footerlogo">Soporte Remoto</div>
            <p>Principales ciudades</p>
            <div class="social-icons">
                <div class="icon">B</div>
                <div class="icon">S</div>
                <div class="icon">C</div>
                <div class="icon">V</div>
            </div>
        </div>
    </footer>
</body>
</html>
